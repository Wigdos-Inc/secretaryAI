# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write AI config from secrets
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_URL: ${{ secrets.GEMINI_URL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          mkdir -p scripts/json
          cat > scripts/json/aiConfig.json <<"EOF"
          {
            "url": "${GEMINI_URL}",
            "key": "${GEMINI_KEY}",
            "model": "${GEMINI_MODEL}"
          }
          EOF
      - run: |
          npm ci
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script, skipping build"
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HARVEY_AI_CONSULTING }}
          channelId: live
          projectId: harvey-ai-consulting
