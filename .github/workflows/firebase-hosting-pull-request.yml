name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write AI config from secrets
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_URL: ${{ secrets.GEMINI_URL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          mkdir -p scripts/json
          cat > scripts/json/aiConfig.json <<'EOF'
          {
            "url": "${GEMINI_URL}",
            "key": "${GEMINI_KEY}",
            "model": "${GEMINI_MODEL}"
          }
          EOF
      - run: |
          npm ci
          if node -e "process.exit(!(require('./package.json').scripts && require('./package.json').scripts.build))"; then
            npm run build
          else
            echo "No build script, skipping build"
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HARVEY_AI_CONSULTING }}
          projectId: harvey-ai-consulting
