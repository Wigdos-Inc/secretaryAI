<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Automation Platform</title> <!-- Placeholder Name -->
    <link rel="shortcut icon" href="assets/images/icons/growthProperties.jpeg" type="image/x-icon">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/userDropdown.css">
    <link rel="stylesheet" href="styles/chatbox.css">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <img src="assets/images/icons/growthPropertiesNoBG.png" alt="GrowthProperties Logo" width="100%">
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="#chatbox" class="nav-item active" data-page="chatbox">
                <i class="bi bi-chat-dots-fill"></i>
                <span>ChatBot</span>
            </a>
            <a href="#history" class="nav-item" data-page="history">
                <i class="bi bi-clock-history"></i>
                <span>History</span>
            </a>
            <a href="#profile" class="nav-item" data-page="profile">
                <i class="bi bi-person-badge"></i>
                <span>Account</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <span id="copyright"><i>
                <!-- Placeholder -->
                GrowthProperties <br>
                2026
            </i></span>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="top-bar">
            <div></div>
            <div class="user-menu-container">
                <div class="user-menu-trigger" id="userMenuTrigger">
                    <i class="bi bi-person-circle"></i>
                    <span id="userMenuName">Account</span>
                    <i class="bi bi-chevron-down"></i>
                </div>
                <div class="user-dropdown" id="userDropdown"></div>
            </div>
        </div>
        <div class="page-content overflow-x-hidden" id="pageContent">
            <!-- Content will be loaded here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK (compat) and Hosting init -- loaded deferred so hosting-provided config is applied -->
    <script defer src="/__/firebase/12.8.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.8.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.8.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>

    <!-- Auth wrapper exposes window.auth and keeps localStorage in sync -->
    <script defer src="scripts/modules/auth.js"></script>

    <script src="scripts/sidebar.js"></script>
</body>
</html>
