<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call</title>
</head>
<body>
    <div class="call-container">
        <div class="page-header">
            <h1>Text</h1>
        </div>

        <div class="ai-avatar-wrapper">
            <div class="ai-avatar overflow-hidden" id="aiAvatar">
                <img src="https://images.seeklogo.com/logo-png/42/1/open-ai-logo-png_seeklogo-428036.png" width="230" alt="">
            </div>
        </div>
    
        <div class="ai-info">
            <p class="call-timer hidden" id="callTimer">00:00</p>
        </div>

        <div class="call-action-buttons">
            <button class="btn-call-action btn-pickup" id="startCallBtn" title="Start Conversation">
                <i class="bi bi-mic-mute-fill"></i>
                <span>Hang up</span>
            </button>
        </div>
    </div>

    <!-- <script src="js/call-interface.js"></script> -->

    
     <!-- Not Sure This Page is Needed -->
</body>
</html>
