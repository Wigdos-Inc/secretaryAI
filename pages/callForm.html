<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/pages/account.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container"><h1 class="fw-bold text-center mt-5">Call Form</h1></div>
    <!-- A Test Form to Trigger the Secretary AI -->
    <div class="container mt-5 mb-5 mx-auto" style="max-width: 50%;">
        <div class="col shadow rounded-4 p-3 mb-5">
            <div class="d-flex justify-content-center mb-3 mx-10">
                <span class="bi bi-telephone-fill fs-1 mb-3 d-inline-block" style="color: var(--bg-secondary-color)"></span>
                <p class="fw-bold m-3">Enter your phone number and let our system call you back!</p>
            </div>
            <hr class="mx-5">

            <form class="mx-5" method="post" action="">
                <label for="phoneNum" class="fw-bold mb-3">Enter your phone number</label>
                <input class="form-control mb-5" type="number" name="phoneNum" id="phoneNum" placeholder="Enter Phone Number" class="form-control mb-3" required><br>

                <div class="text-center"><input class="fw-bold btn shadow p-2 px-4 rounded-3 button_primary" type="submit" value="Submit"></div>
            </form>
        </div>
    </div>
</body>
</html>
