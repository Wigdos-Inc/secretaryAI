<div class="call-form-page">
    <div class="container">
        <h1 class="fw-bold text-center mt-5">Call Form</h1>
    </div>

    <!-- A Test Form to Trigger the Secretary AI -->
    <div class="container mt-5 mb-5 mx-auto" style="max-width: 50%;">
        <div class="call-form-card shadow rounded-4 p-3 mb-5">
            <div class="d-flex justify-content-center mb-3">
                <span class="bi bi-telephone-fill fs-1 mb-3 d-inline-block call-form-icon"></span>
                <p class="fw-bold m-3">Enter your phone number and let our system call you back!</p>
            </div>
            <hr class="mx-5">

            <form class="mx-5" method="post" action="">
                <label for="phoneNum" class="fw-bold mb-3">Enter your phone number</label>
                <input class="form-control mb-5" type="number" name="phoneNum" id="phoneNum" placeholder="Enter Phone Number" required><br>

                <div class="text-center">
                    <input class="fw-bold btn shadow p-2 px-4 rounded-3 button_primary" type="submit" value="Submit">
                </div>
            </form>
        </div>
    </div>
</div>
