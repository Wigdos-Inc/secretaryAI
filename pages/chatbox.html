<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="container m-2 d-flex justify-content-center">
      <div id="chat" class="col-11">
        <div class="mt-3 fw-bold font-medium" id="chatBody">
            <div id="chat-message">
              <div class="chat-bubble text-center mb-2">How can I help you today?</div>
            </div>
        </div>
      </div>
    </div>
    <div class="p-5"></div>

    <div class="col-6 d-flex mb-4 fixed-bottom" style="transform: translate(-35%); left: 50%;">
        <input type="text" id="userInput" class="form-control" placeholder="Type your message...">
        <button class="btn btn-primary" id="sendBtn"><i class="bi bi-send-fill"></i></button>
    </div>

    <script src="../scripts/chat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
