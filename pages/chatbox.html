<div class="chat-container">
    <!-- Welcome Message -->
    <h1 class="welcome-title">How can I help you today?</h1>

    <!-- Action Cards -->
    <div class="action-cards">
        <div class="action-card" onclick="changeHash('search')">
            <div class="card-icon">
                <i class="bi bi-house-fill"></i>
            </div>
            <h3>View Properties</h3>
        </div>

        <div class="action-card" onclick="changeHash('chatbox')">
            <div class="card-icon">
                <i class="bi bi-headset"></i>
            </div>
            <h3>Contact Support</h3>
        </div>

        <div class="action-card" onclick="changeHash('profile')">
            <div class="card-icon">
                <i class="bi bi-person-fill"></i>
            </div>
            <h3>My Account</h3>
        </div>
    </div>

    <!-- Chat Messages Area -->
    <div class="chat-messages" id="chatBox"></div>

    <!-- Floating Message Input -->
    <div class="message-input-container">
        <div class="message-input">
            <form id="promptForm"> <!-- For Easy Funtion Trigger -->
                <input type="text" placeholder="Type your message..." id="chatInput" />
                <button class="send-btn" id="sendBtn" type="submit">
                    <i class="bi bi-send-fill"></i>
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="../scripts/pages/chat.js"></script>
</div>
