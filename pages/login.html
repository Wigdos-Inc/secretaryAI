<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="../styles/pages/account.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand">
                    <span>[Logo Goes Here]</span>
                </div>
                <h2>Welcome Back</h2>
                <p>Login to access your intelligent business assistant</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" class="form-control" id="loginEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </div>
            </form>

            <div class="auth-link">
                Don't have an account? <a href="#register" data-page="register">Sign up here</a>
            </div>
            <script type="module" src="../scripts/modules/login.js"></script>
        </div>
    </div>

    <script>
    (function () {
        const form = document.getElementById('loginForm');
        if (!form) return;
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            try {
                await window.auth.login(email, password);
                // after successful login, go to chatbox and reload so sidebar picks up session
                window.location.hash = '#chatbox';
                location.reload();
            } catch (err) {
                alert(err.message || 'Login failed');
                console.error(err);
            }
        });
    })();
    </script>
</body>
</html>
