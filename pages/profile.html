<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/pages/account.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<style>
.popup {
    background-color: white;
    position: fixed;
    top: 50%; left: calc(6% + 50%);
    transform: translate(-50%, -50%);
    z-index: 100;
}

/* Z-index fix for content - ensures forms stay above background */
.container {
    position: relative;
    z-index: 10;
}

.container .col {
    position: relative;
    z-index: 10;
    background-color: white;
}

.shadow {
    position: relative;
    z-index: 10;
}

.profile-logo {
    width: 300px;
    max-width: 80%;
    height: auto;
}
</style>
<body>
    <div class="container"><h1 class="fw-bold text-center mt-5">My Account</h1></div>

    <!-- Main Profile Container -->
    <div class="container mt-5 mb-5 mx-auto" style="max-width: 85%;">
        <div class="col shadow rounded-4 px-3 pt-2 pb-3 mb-5 text-center">
            <div class="mt-0 mb-0">
                <img class="rounded-circle profile-logo" src="assets/images/icons/growthPropertiesNoBG.png" alt="GrowthProperties Logo">
            </div>
            <h2 class="fw-bold mt-1 mb-4" id="name">Hallo, Joe Bloggs</h2>
            <hr class="mx-5 mb-5">

            <div class="row">
                <p class="col text-start m-2 mx-5">Email Address</p>
                <p id="email" class="col text-end m-2 mx-5">Joe.Bloggs@email.com</p>
            </div>
            <hr class="mx-5">

            <div class="row">
                <p class="col text-start m-2 mx-5">Phone Number</p>
                <p id="phone" class="col text-end m-2 mx-5">+1(555) 123-4567</p>
            </div>
            <hr class="mx-5">
            <div class="row">
                <p class="col text-start m-2 mx-5">Member Since</p>
                <p id="memberSince" class="col text-end m-2 mx-5">January 2024</p>
            </div>
            <hr class="mx-5">
            <div class="mt-5 mb-4">
                <button id="editProfileBtn" class="button_primary fw-bold btn shadow me-3 p-2 px-4 rounded-3">Edit Profile</button>
                <button id="changePasswordBtn" class="fw-bold btn shadow p-2 px-4 rounded-3">Change Password</button>
            </div>
        </div>

        <div class="col shadow rounded-4 p-3 mb-5">
            <div class="text-start py-4 px-5">
                <h4 class="fw-bold mb-3 mt-0">Danger Zone</h4>
                <button id="deleteAccountBtn" class="fw-bold btn btn-danger">Delete Account</button>
            </div>
        </div>
    </div>

    <!-- Popup Container -->
    <div class="container mx-auto" style="max-width: 60%;">
        <div id="popup_background" class="vh-100 vw-100 position-fixed top-0 start-0" style="background-color: rgba(146, 146, 146, 0.407); display: none;"></div>
        <!-- Change Personal Account Info Popup -->
        <div id="popup_account_info" class="shadow rounded-4 p-5 mb-3 popup position-fixed" style="display: none;">
            <h2 class="fw-bold mb-3">Update Personal Information</h2>
            <form id="account_info_form" method="post" action="">
                <div class="row">
                    <div class="col-3 mb-4">
                        <label class="form-label fw-bold" for="voornaam">First name</label>
                        <input class="form-control" type="text" name="voornaam" id="voornaam" value="Joe">
                    </div>

                    <div class="col-3 mb-4">
                        <label class="form-label fw-bold" for="achternaam">Last name</label>
                        <input class="form-control" type="text" name="achternaam" id="achternaam" value="Bloggs">
                    </div>
                </div>

                <div class="col-6 mb-4">
                    <label class="form-labelfw-bold" for="phoneNum">Phone number</label>
                    <input class="form-control" type="number" name="phoneNum" id="phoneNum" value="">
                </div>

                <div class="col-6 mb-4">
                    <!-- <input class="form-control" type="submit" value="Update Information"><br> -->
                    <input class="form-control" type="reset" value="Reset">
                </div>
            </form>

            <button id="popup_account_info_done" class="fw-bold btn shadow p-2 px-4 rounded-3">Done</button>
        </div>

        <!-- Change Password Popup -->
        <div class="col shadow rounded-4 p-5 mb-3 popup" style="display: none;">
            <h2 class="fw-bold mb-3">Change Password</h2>
            <form class="col" method="post" action="">
                <input class="form-control" type="password" name="old_password" id="old_password" placeholder="Current Password"><br>
                <input class="form-control" type="password" name="new_password" id="new_password" placeholder="New Password"><br>

                <input class="form-control" type="password" name="password_check" id="password_check" placeholder="Password (Again)"><br><br>

                <input class="form-control" type="submit" value="Update Information"><br>
                <input class="form-control" type="reset" value="Reset">
            </form>
        </div>
    </div>

    <script type="module" src="../scripts/modules/profile.js"></script>
</body>
</html>
