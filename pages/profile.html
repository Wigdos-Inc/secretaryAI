<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="col bgc-primary rounded p-3 mb-3 text-center">
            <div class="mb-2">
                <img class="rounded-circle" src="https://images.seeklogo.com/logo-png/42/1/open-ai-logo-png_seeklogo-428036.png" width="230" alt="">
            </div>
            <h1 class="text-light fw-bold">Hallo, Joe Bloggs</h1>
        </div>
            
        <div class="col bgc-primary rounded p-3 mb-3">
            <h2 class="text-light fw-bold mb-3">Update Personal Information</h2>
            <form method="post" action="">
                <div class="row">
                    <div class="col-3 mb-4">
                        <label class="form-label text-light fw-bold" for="voornaam">First name</label>
                        <input class="form-control" type="text" name="voornaam" id="voornaam" value="Joe">
                    </div>

                    <div class="col-3 mb-4">
                        <label class="form-label text-light fw-bold" for="achternaam">Last name</label>
                        <input class="form-control" type="text" name="achternaam" id="achternaam" value="Bloggs">
                    </div>
                </div>

                <div class="col-6 mb-4">
                    <label class="form-label text-light fw-bold" for="email">Email</label>
                    <input class="form-control" type="email" name="email" id="email" value="Joe@Blog.com">
                </div>

                <div class="col-6 mb-4">
                    <input class="form-control" type="submit" value="Update Information"><br>
                    <input class="form-control" type="reset" value="Reset">
                </div>
            </form>
        </div>

        <div class="col bgc-primary rounded p-3 mb-3">
            <h2 class="text-light fw-bold mb-3">Change Password</h2>
            <form class="col-5" method="post" action="">
                <input class="form-control" type="password" name="old_password" id="old_password" placeholder="Current Password"><br>
                <input class="form-control" type="password" name="new_password" id="new_password" placeholder="New Password"><br>

                <input class="form-control" type="password" name="password_check" id="password_check" placeholder="Password (Again)"><br><br>

                <input class="form-control" type="submit" value="Update Information"><br>
                <input class="form-control" type="reset" value="Reset">
            </form>
        </div>

        <div class="col bg-danger rounded p-3 mb-3">
            <h2 class="text-light fw-bold mb-3">Danger Zone</h2>
            <button class="fw-bold text-light btn btn-warning">Delete Account</button>
        </div>
    </div>
</body>
</html>
