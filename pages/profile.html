<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/pages/account.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<style>
/* Container */
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

/* Hide default checkbox */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* The slider */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #ccc;
  transition: 0.4s;
  border-radius: 34px;
}

/* The knob */
.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: 0.4s;
  border-radius: 50%;
}

/* When checked, turn green and move knob */
input:checked + .slider {
  background-color: #80D411; /* green */
}

input:checked + .slider:before {
  transform: translateX(26px);
}

.popup {
    background-color: white;
    position: fixed;
    top: 50%; left: calc(6% + 50%);
    transform: translate(-50%, -50%);
}
</style>
<body>
    <div class="container"><h1 class="fw-bold text-center mt-5">My Account</h1></div>

    <!-- Main Profile Container -->
    <div class="container mt-5 mb-5 mx-auto" style="max-width: 85%;">
        <div class="col shadow rounded-4 p-3 mb-5 text-center">
            <div class="mb-2">
                <img class="rounded-circle" src="https://images.seeklogo.com/logo-png/42/1/open-ai-logo-png_seeklogo-428036.png" width="150" alt="">
            </div>
            <h2 class="fw-bold" id="name">Hallo, Joe Bloggs</h2>
            <p id="email" class="mb-5">Joe.Bloggs@email.com</p>

            <hr class="mx-5 mb-5">

            <div class="row">
                <p class="col text-start m-2 mx-5">Phone Number</p>
                <p id="phone" class="col text-end m-2 mx-5">+1(555) 123-4567</p>
            </div>
            <hr class="mx-5">
            <div class="row">
                <p class="col text-start m-2 mx-5">Member Since</p>
                <p id="memberSince" class="col text-end m-2 mx-5">January 2024</p>
            </div>
            <hr class="mx-5">
            <!-- Account type and saved properties removed per request -->

            <div class="mt-5 mb-4">
                <button id="editProfileBtn" class="button_primary fw-bold btn shadow me-3 p-2 px-4 rounded-3">Edit Profile</button>
                <button id="changePasswordBtn" class="fw-bold btn shadow p-2 px-4 rounded-3">Change Password</button>
                <button id="clearSavedBtn" class="btn btn-outline-secondary ms-3">Clear Saved Properties</button>
            </div>
        </div>

        <div class="col shadow rounded-4 p-3 mb-5 pb-5">
            <h4 class="fw-bold mb-3 mx-5 mt-4">Preferences</h4>
            <div class="row">
                <p class="col text-start m-2 mx-5">Email Notifications</p>
                <label class="switch m-2 mx-5">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="row">
                <p class="col text-start m-2 mx-5">SMS Notifications</p>
                <label class="switch m-2 mx-5">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
            <hr class="mx-5">
            <h4 class="fw-bold mb-4 mx-5 mt-4">Danger Zone</h4>
            <div class="mx-5 mb-3">
                <button id="deleteAccountBtn" class="fw-bold btn btn-danger">Delete Account</button>
            </div>
        </div>
    </div>

    <!-- Popup Container -->
    <div class="container mx-auto" style="max-width: 50%;">
        <!-- Change Personal Account Info Popup -->
        <div class="shadow rounded-4 p-5 mb-3 popup" style="display: none;">
            <h2 class="fw-bold mb-3">Update Personal Information</h2>
            <form method="post" action="">
                <div class="row">
                    <div class="col-3 mb-4">
                        <label class="form-label fw-bold" for="voornaam">First name</label>
                        <input class="form-control" type="text" name="voornaam" id="voornaam" value="Joe">
                    </div>

                    <div class="col-3 mb-4">
                        <label class="form-label fw-bold" for="achternaam">Last name</label>
                        <input class="form-control" type="text" name="achternaam" id="achternaam" value="Bloggs">
                    </div>
                </div>

                <div class="col-6 mb-4">
                    <label class="form-labelfw-bold" for="email">Email</label>
                    <input class="form-control" type="email" name="email" id="email" value="Joe@Blog.com">
                </div>

                <div class="col-6 mb-4">
                    <input class="form-control" type="submit" value="Update Information"><br>
                    <input class="form-control" type="reset" value="Reset">
                </div>
            </form>

            <button class="fw-bold btn shadow p-2 px-4 rounded-3">Done</button>
        </div>

        <!-- Change Password Popup -->
        <div class="col shadow rounded-4 p-5 mb-3 popup" style="display: none;">
            <h2 class="fw-bold mb-3">Change Password</h2>
            <form class="col" method="post" action="">
                <input class="form-control" type="password" name="old_password" id="old_password" placeholder="Current Password"><br>
                <input class="form-control" type="password" name="new_password" id="new_password" placeholder="New Password"><br>

                <input class="form-control" type="password" name="password_check" id="password_check" placeholder="Password (Again)"><br><br>

                <input class="form-control" type="submit" value="Update Information"><br>
                <input class="form-control" type="reset" value="Reset">
            </form>
        </div>
    </div>

    <script type="module" src="../scripts/modules/profile.js"></script>
</body>
</html>
