<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="../styles/pages/account.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand">
                    <span>[Logo Goes Here]</span>
                </div>
                <h2>Create Your Account</h2>
                <p>Start automating your business communications today</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input type="text" class="form-control" id="registerName" placeholder="John Smith" required>
                </div>

                <div class="form-group">
                    <label for="registerCompany">Company Name</label>
                    <input type="text" class="form-control" id="registerCompany" placeholder="Your Business Name">
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" class="form-control" id="registerEmail" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" class="form-control" id="registerPassword" placeholder="Create a strong password" required>
                </div>

                <div class="form-group">
                    <label for="registerPasswordConfirm">Confirm Password</label>
                    <input type="password" class="form-control" id="registerPasswordConfirm" placeholder="Repeat your password" required>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-secondary w-100">
                        <i class="bi bi-person-plus-fill me-2"></i>Create Account
                    </button>
                </div>
            </form>

            <div class="auth-link">
                Already have an account? <a href="#login" data-page="login">Login here</a>
            </div>
            <script type="module" src="../scripts/modules/register.js"></script>
        </div>
    </div>

    <script>
    (function () {
        const form = document.getElementById('registerForm');
        if (!form) return;
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value.trim();
            const company = document.getElementById('registerCompany').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
            if (password !== passwordConfirm) {
                alert('Passwords do not match');
                return;
            }
            try {
                await window.auth.register(name, company, email, password);
                // after register, navigate to chatbox and reload so sidebar picks up session
                window.location.hash = '#chatbox';
                location.reload();
            } catch (err) {
                alert(err.message || 'Registration failed');
                console.error(err);
            }
        });
    })();
    </script>
</body>
</html>
