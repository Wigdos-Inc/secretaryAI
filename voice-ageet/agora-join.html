<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agora Join Test — Secretary AI</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.8.2.js"></script>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;margin:20px}
    label{display:block;margin-top:10px}
    input{width:320px;padding:6px}
    button{margin-top:10px;padding:8px 12px}
    #log{white-space:pre-wrap;border:1px solid #ddd;padding:10px;height:200px;overflow:auto;margin-top:10px}
  </style>
</head>
<body>
  <h2>Agora Join Test (secretary-channel)</h2>
  <label>Channel: <input id="channel" value="secretary-channel"/></label>
  <label>UID (numeric): <input id="uid" value="0"/></label>
  <div>
    <button id="joinBtn">Join</button>
    <button id="leaveBtn" disabled>Leave</button>
    <button id="publishMicBtn" disabled>Publish Mic</button>
    <button id="unpublishMicBtn" disabled>Unpublish Mic</button>
  </div>
  <div id="status">Status: idle</div>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    function log(...args){ console.log(...args); logEl.textContent += args.map(a=>typeof a==='object'?JSON.stringify(a):a).join(' ') + '\n'; logEl.scrollTop = logEl.scrollHeight; }

    let client = null;
    let localAudioTrack = null;

    async function getToken(channel, uid){
      // If the static page is served from localhost, call the local server on port 10000.
      const apiBase = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost')
        ? `${window.location.protocol}//${window.location.hostname}:10000`
        : '';
      const url = `${apiBase}/agora/token?channel=${encodeURIComponent(channel)}&uid=${encodeURIComponent(uid)}`;
      const r = await fetch(url, { mode: 'cors' });
      if (!r.ok) throw new Error('token request failed: ' + r.status);
      return r.json();
    }

    document.getElementById('joinBtn').onclick = async () => {
      try {
        const channel = document.getElementById('channel').value || 'secretary-channel';
        const uid = parseInt(document.getElementById('uid').value || '0', 10);
        statusEl.textContent = 'Status: requesting token';
        const data = await getToken(channel, uid);
        if (data.error) throw new Error(data.error);
        const appId = data.appId;
        const token = data.token;
        log('Token received, joining', channel, 'uid=', uid);

        client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
        client.on('user-published', async (user, mediaType) => {
          log('user-published', user.uid, mediaType);
          await client.subscribe(user, mediaType);
          if (mediaType === 'audio') {
            const remoteAudioTrack = user.audioTrack;
            remoteAudioTrack.play();
            log('Playing remote audio from', user.uid);
          }
        });
        client.on('user-unpublished', (user) => log('user-unpublished', user.uid));
        client.on('user-joined', (user) => log('user-joined', user.uid));
        client.on('user-left', (user) => log('user-left', user.uid));

        await client.join(appId, channel, token, uid);
        statusEl.textContent = 'Status: joined channel ' + channel;
        document.getElementById('joinBtn').disabled = true;
        document.getElementById('leaveBtn').disabled = false;
        document.getElementById('publishMicBtn').disabled = false;
        log('Joined channel', channel);
      } catch (e) {
        log('Join error', e.message || e);
        statusEl.textContent = 'Status: error';
      }
    };

    document.getElementById('publishMicBtn').onclick = async () => {
      try {
        if (!client) throw new Error('not joined');
        localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
        await client.publish([localAudioTrack]);
        log('Published local microphone');
        document.getElementById('publishMicBtn').disabled = true;
        document.getElementById('unpublishMicBtn').disabled = false;
      } catch (e) { log('Publish mic error', e); }
    };

    document.getElementById('unpublishMicBtn').onclick = async () => {
      try {
        if (!client || !localAudioTrack) return;
        await client.unpublish([localAudioTrack]);
        localAudioTrack.close();
        localAudioTrack = null;
        log('Unpublished mic');
        document.getElementById('publishMicBtn').disabled = false;
        document.getElementById('unpublishMicBtn').disabled = true;
      } catch (e) { log('Unpublish error', e); }
    };

    document.getElementById('leaveBtn').onclick = async () => {
      try {
        if (!client) return;
        if (localAudioTrack) { await client.unpublish([localAudioTrack]); localAudioTrack.close(); localAudioTrack = null; }
        await client.leave();
        client = null;
        statusEl.textContent = 'Status: left';
        document.getElementById('joinBtn').disabled = false;
        document.getElementById('leaveBtn').disabled = true;
        document.getElementById('publishMicBtn').disabled = true;
        document.getElementById('unpublishMicBtn').disabled = true;
        log('Left channel');
      } catch (e) { log('Leave error', e); }
    };

    // helpful hotkeys
    window.addEventListener('keydown', (e) => {
      if (e.key === 'j') document.getElementById('joinBtn').click();
      if (e.key === 'l') document.getElementById('leaveBtn').click();
    });
  </script>
</body>
</html>
