<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secretary AI Voice Agent - Property Seller Assistant</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Secretary AI Voice Agent</h1>
        <p>Property Seller Assistant</p>
      </div>

      <div class="content">
        <div class="status-bar">
          <div class="status-item">
            <div class="status-indicator" id="deepgramStatus"></div>
            <span id="deepgramStatusText">Voice Agent: Disconnected</span>
          </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <div>Processing your request...</div>
        </div>

        <div class="controls">
          <button class="btn btn-primary" id="startBtn">Start Call</button>
          <button class="btn btn-danger" id="stopBtn" disabled>
            Stop Call
          </button>
        </div>

        <div class="recording-animation" id="recordingAnimation">
          <div class="recording-bar"></div>
          <div class="recording-bar"></div>
          <div class="recording-bar"></div>
          <div class="recording-bar"></div>
        </div>

        <div class="conversation-log" id="conversationLog"></div>

        <div class="session-info">
          <div class="session-info-item">
            <span class="session-info-label">Session ID</span>
            <span id="sessionId">-</span>
          </div>
          <div class="session-info-item">
            <span class="session-info-label">Messages</span>
            <span id="messageCount">0</span>
          </div>
          <div class="session-info-item">
            <span class="session-info-label">Started</span>
            <span id="startTime">-</span>
          </div>
        </div>
      </div>
    </div>

    <script src="voice-agent.js"></script>
  </body>
</html>
